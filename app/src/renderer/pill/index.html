<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'; media-src 'self' blob: mediastream:;" />
    <title>VozFlow</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="pill.css" />
  </head>
  <body>
    <div class="stage">
      <section class="card" id="suggest" aria-live="polite">
        <p class="card-title" id="suggest-title"></p>
        <p class="card-sub">Se completan con base en lo que dijiste y quedan marcadas como sugeridas.</p>
        <div class="card-actions">
          <button class="btn-primary" data-act="suggest-yes">Agregarlas</button>
          <button class="btn-ghost" data-act="suggest-no">Pegar así</button>
        </div>
        <div class="countdown"><span id="countdown-bar"></span></div>
      </section>

      <p class="hint" id="hint"></p>

      <div class="pill" id="pill" data-state="idle" data-mode="text">
        <div class="layer layer-idle">
          <button class="chip" data-act="dictate" data-tip="Mantén {k}">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></svg>
            Dictar
          </button>
          <button class="chip chip-prompt" data-act="prompt" data-tip="Mantén {k} + Shift">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h8M4 15h10"/><circle cx="15.5" cy="10" r="1.6" class="fill"/></svg>
            Prompt
          </button>
          <span class="divider" aria-hidden="true"></span>
          <button class="icon-btn" data-act="settings" aria-label="Abrir ajustes">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.8v2.1M10 15.1v2.1M17.2 10h-2.1M4.9 10H2.8M15.1 4.9l-1.5 1.5M6.4 13.6l-1.5 1.5M15.1 15.1l-1.5-1.5M6.4 6.4 4.9 4.9"/></svg>
          </button>
        </div>

        <div class="layer layer-live">
          <button class="icon-btn icon-btn-sm" data-act="cancel" aria-label="Cancelar">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8"/></svg>
          </button>
          <span class="mode-tag" id="mode-tag">Dictado</span>
          <canvas id="wave" width="0" height="0"></canvas>
          <span class="label" id="label"></span>
          <span class="timer" id="timer">0:00</span>
          <button class="stop" data-act="stop" aria-label="Terminar y pegar"><span></span></button>
        </div>

        <div class="layer layer-status">
          <span class="status-icon" id="status-icon"></span>
          <span class="status-text" id="status-text"></span>
          <button class="status-action" id="status-action" data-act="settings">Abrir ajustes</button>
        </div>
      </div>
    </div>
    <script src="pill.js"></script>
  </body>
</html>
